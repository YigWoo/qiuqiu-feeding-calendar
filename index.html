, "条目": "奶仍是主食", "内容": "开始辅食后仍继续配方奶。不要为了吃辅食强行减少奶量；奶量、维生素D/铁补充按儿保医生和配方奶产品说明执行。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "首次新食材", "内容": "前期首次食材、过敏原及后续补充轮换均已在“新增食材或观察”列逐日标注。首次安排在白天、宝宝健康且能观察至少2小时的时段；当日不要再加其他新食物。后期仅轮换已耐受食材。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "过敏处理", "内容": "若出现全身风团、面唇舌肿、反复呕吐、咳喘/声音嘶哑、脸色差或精神萎靡：立即停止进食并急诊/120。轻度皮疹/腹泻也先停该食物，拍照并咨询儿科。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "窒息防护", "内容": "必须坐直、成人一对一看护；不喂整粒花生/坚果、整颗葡萄或圣女果、硬生苹果/胡萝卜、果冻、整粒豆、带刺带骨鱼肉、圆片香肠等。花生酱、芝麻酱必须调稀。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "禁忌/限制", "内容": "1岁前不加蜂蜜；不加盐、糖、酱油或重口调味；不提供果汁、含糖饮料；不将纯牛奶/植物奶作为饮料或配方奶替代。酸奶仅限原味全脂、作为食物少量出现。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "米粉选择", "内容": "优先强化铁的燕麦/大麦/多谷物婴儿米粉，轮换使用；不要长期只吃米粉或只用果蔬泥替代富铁动物性食物。", "参考链接/日期": null}, {"模块": "使用说明", "条目": "就医/儿保优先", "内容": "早产、增长曲线异常、持续呕吐/吞咽困难、贫血、慢病、食物反应史或出现重度湿疹时，此表不替代医生或注册营养师的个体化方案。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "普通植物油", "内容": "首次日期：2026-10-17；第1次：1mL 菜籽油/橄榄油二选一；第2次：1mL 同种油；第3次/耐受后维持：2mL；之后按每日计划少量添加；安全形态与边界：拌入煮熟、已耐受的食物；不是排敏重点；不油炸、不加到奶瓶。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "核桃（树坚果）", "内容": "首次日期：2026-10-20；第1次：核桃粉/核桃酱 1g，充分调稀；第2次：2g，充分调稀；第3次/耐受后维持：3g；耐受后约每周2次；安全形态与边界：树坚果是独立过敏原类别。不能用核桃油代替核桃粉/酱做排敏；严禁整粒核桃/坚果。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "核桃油", "内容": "首次日期：2026-10-23；第1次：1mL（前提：核桃粉/酱耐受）；第2次：1mL；第3次/耐受后维持：2mL；与普通植物油轮换；安全形态与边界：作为油脂辅料，不是确定剂量的树坚果过敏原暴露；任何冷榨/未精炼产品都可能有残留蛋白。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "甲壳类（虾）", "内容": "首次日期：2026-10-26；第1次：彻底煮熟虾泥2g；第2次：5g；第3次/耐受后维持：10g；耐受后约每周1次；安全形态与边界：替换当天一份蛋白食物；去壳、去肠线、打成细泥；首次白天，成人观察。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "蛋", "内容": "首次日期：2026-09-29；第1次：全熟蛋泥约5g；第2次：约10g；第3次/耐受后维持：约15g；耐受后每周2–3次；安全形态与边界：全熟；不喂溏心蛋。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "花生", "内容": "首次日期：2026-10-02；第1次：调稀花生酱约2g；第2次：约4g；第3次/耐受后维持：约6g；耐受后每周2–3次；安全形态与边界：调稀后勺喂；不喂整粒花生或厚黏花生酱。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "大豆/豆腐", "内容": "首次日期：2026-10-05；第1次：嫩豆腐泥15g；第2次：20g；第3次/耐受后维持：耐受后每周2–3次；安全形态与边界：嫩豆腐压泥；整粒豆要更晚且必须软烂压碎。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "乳制品", "内容": "首次日期：2026-10-07；第1次：原味全脂酸奶15g；第2次：20g；第3次/耐受后维持：耐受后每周2–3次；安全形态与边界：酸奶是食物；1岁前不以纯牛奶/植物奶作为饮料或配方奶替代。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "小麦", "内容": "首次日期：2026-10-09；第1次：煮软碎面20g；第2次：25g；第3次/耐受后维持：耐受后规律出现；安全形态与边界：煮软、切碎；不喂干硬饼干块。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "鱼", "内容": "首次日期：2026-10-11；第1次：去刺鱼泥10g；第2次：15g；第3次/耐受后维持：耐受后每周1–2次；安全形态与边界：彻底去刺；与虾为不同类别，不互相替代。", "参考链接/日期": null}, {"模块": "油脂与类别食物引入", "条目": "芝麻", "内容": "首次日期：2026-10-13；第1次：调稀芝麻酱约3g；第2次：约5g；第3次/耐受后维持：耐受后每周1–2次；安全形态与边界：调稀拌入熟食；整粒芝麻不作为婴儿主要形态。", "参考链接/日期": null}, {"模块": "口感与分装建议", "条目": "酸奶餐", "内容": "推荐：原味全脂酸奶＋苹果/梨/香蕉/牛油果熟泥或压泥；不作为日常默认：酸奶＋米粉糊混成一碗；实际喂法：首次酸奶及早期适应期优先分小勺交替或轻拌果泥；酸奶本身不加糖。", "参考链接/日期": null}, {"模块": "口感与分装建议", "条目": "甜口加餐", "内容": "推荐：冲调后高铁米粉糊＋单一水果泥；或调稀花生/芝麻酱＋水果泥；不作为日常默认：米粉糊＋水果＋蔬菜三种混合；实际喂法：甜口一次只保留一个主要风味；花生酱/芝麻酱务必先调稀。", "参考链接/日期": null}, {"模块": "口感与分装建议", "条目": "咸口正餐", "内容": "推荐：软粥/软面/软饭＋肉/蛋/鱼/豆腐＋一种蔬菜；不作为日常默认：鱼/肉/蛋＋水果泥混在同一碗；实际喂法：肉菜可压碎同拌；若球球更愿意辨识食材，可并排分放、交替喂。", "参考链接/日期": null}, {"模块": "口感与分装建议", "条目": "过敏原维持", "内容": "推荐：鸡蛋/鱼/豆腐搭配谷物＋蔬菜；花生/芝麻搭配水果；虾替换一份动物蛋白；不作为日常默认：为了完成维持而额外加一餐或叠加过多食材；实际喂法：维持量应替换当餐等量已耐受食材，保持原有总供给量。", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "富铁动物性食物", "内容": "可用食材/形态：瘦猪/牛/鸡肉，鱼，全熟蛋；处理方法：蒸/煮熟；肉打泥→碎末；鱼彻底去刺；蛋必须全熟；绝对不要这样喂：生/半生、带骨刺、大块硬肉", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "主食", "内容": "可用食材/形态：强化铁婴儿米粉、稠粥、软饭、软面；处理方法：由细腻浓稠糊逐步到粗泥、软粒、软饭面；绝对不要这样喂：稀米汤替代正餐、长期只吃单一种米粉", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "蔬果", "内容": "可用食材/形态：南瓜、西兰花、胡萝卜、菠菜、红薯；苹果、梨、香蕉、牛油果；处理方法：蔬菜蒸软；硬果蒸熟压泥；去皮去籽去核；绝对不要这样喂：果汁、硬生块、整颗葡萄/圣女果", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "花生/芝麻", "内容": "可用食材/形态：花生酱、芝麻酱；处理方法：每次取少量，用温水/米粉/果泥充分调稀后勺喂；绝对不要这样喂：整粒坚果、厚黏一坨坚果酱", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "奶制品", "内容": "可用食材/形态：原味全脂酸奶；处理方法：少量作为食物；无糖、巴氏消毒；绝对不要这样喂：1岁前用纯牛奶/植物奶当饮料或替代配方奶", "参考链接/日期": null}, {"模块": "食材处理与安全", "条目": "调味与饮品", "内容": "可用食材/形态：原味食物、少量饮水；处理方法：家庭餐单独盛出后再调味；绝对不要这样喂：蜂蜜（1岁前）、盐、糖、酱油、果汁、含糖饮料", "参考链接/日期": null}, {"模块": "权威资料与计划边界", "条目": "中国疾控中心《6-23月龄婴幼儿辅食喂养指南》", "内容": "健康足月儿满180
